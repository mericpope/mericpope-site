</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, sans-serif; color: #1C1A1F; display: flex; flex-direction: column; padding: 56px 24px 32px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

    <span style="font-size: 13px; color: #5F5966; font-weight: 500">Question 4 of 7</span>

  </div>
  <div style="height: 4px; background: #ECE5DD; border-radius: 4px; margin-top: 12px; overflow: hidden">
    <div style="width: 57%; height: 4px; background: #8A2A4B; border-radius: 4px"></div>
  </div>

  <p style="margin: 32px 0 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: #8A2A4B">Your secret wishlist</p>
  <h1 style="margin: 10px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.12; letter-spacing: -0.01em">What date would you secretly love someone to plan for you?</h1>
  <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: #5F5966">Pick as many as you like. Matches never see this list. We turn it into ideas for them, one at a time.</p>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
    <button class="chip on" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>A picnic someone else packed</button>
    <button class="chip" aria-pressed="false">Late-night jazz, somewhere small</button>
    <button class="chip on" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A2A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>A show I'd never pick myself</button>
    <button class="chip" aria-pressed="false">Cooking something new together</button>
    <button class="chip" aria-pressed="false">Sunrise from somewhere high</button>
  </div>

  <label for="own" style="margin-top: 18px; font-size: 13px; font-weight: 600; color: #3D3842">Or write your own</label>
  <input id="own" type="text" placeholder="A bookshop crawl ending in dumplings…" style="margin-top: 8px; font: 15px Inter, sans-serif; padding: 14px 16px; border: 1.5px solid #E4DCD3; border-radius: 14px; background: #FFFFFF; color: #1C1A1F; outline: none">

  <div style="flex-grow: 1"></div>
  <button style="height: 54px; border: none; border-radius: 27px; background: #1C1A1F; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Continue</button>
</div>
