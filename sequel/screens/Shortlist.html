<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shortlist card</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2A4B}a:hover{color:#6A1F39}
.tag{font:500 13px/1 Inter,sans-serif;color:#3D3842;background:#F1ECE6;border-radius:999px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#8A2A4B}
.h1{margin:8px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.sub{margin:10px 0 0;font-size:15px;line-height:1.5;color:#5F5966}
.primary{height:54px;border:none;border-radius:27px;background:#8A2A4B;color:#FFFFFF;font:600 16px Inter,sans-serif;cursor:pointer}
.secondary{height:50px;border:1.5px solid #E4DCD3;border-radius:25px;background:#FFFFFF;color:#1C1A1F;font:500 15px Inter,sans-serif;cursor:pointer}
.note{margin:0;font-size:13px;line-height:1.45;color:#5F5966;text-align:center}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;font:500 11px Inter,sans-serif;color:#6E6875;min-height:48px;padding:6px 0;cursor:pointer}
.navbtn.on{color:#8A2A4B}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, sans-serif; color: #1C1A1F; display: flex; flex-direction: column">
  <div style="padding: 56px 24px 0; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">Your shortlist</h1>
    <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 13px; color: #5F5966; font-weight: 500">2 of 4</span><span aria-hidden="true" style="display: flex; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #DCD3CA"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #8A2A4B"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #DCD3CA"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #DCD3CA"></span></span></div>
  </div>

  <div style="margin: 16px 16px 0; background: #FFFFFF; border: 1px solid #EAE3DB; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column">
    <div style="background: #1C1A1F; color: #FFFFFF; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: #F2B8CB">The date</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2">[Play] at [Venue]</span>
      <span style="font-size: 14px; color: #CFC9D3; display: flex; flex-wrap: wrap; gap: 4px 14px">
        <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#CFC9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Thursday, 7:30pm</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#CFC9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>15 min from you</span>
      </span>
    </div>

    <div style="height: 150px; background: #E9DDD3; position: relative; display: flex; align-items: flex-end; padding: 14px 18px; box-sizing: border-box">
      <span style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%)"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#B8A698" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>
      <span aria-hidden="true" style="position: absolute; top: 12px; left: 18px; right: 18px; display: flex; gap: 4px"><span style="flex: 1; height: 3px; border-radius: 2px; background: #FFFFFF"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.5)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.5)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.5)"></span></span>
      <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">with Sam, 31</span>
        <span style="font-size: 13px; color: #3D3842">Looking for a relationship</span>
      </div>
    </div>

    <div style="padding: 14px 18px 0; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: #6E6875">What you share</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="tag">Theatre</span><span class="tag">Jazz</span><span class="tag">[Musical title]</span></div>
    </div>

    <div style="margin: 14px 18px 0; padding: 14px; background: #F7F1EB; border-radius: 16px">
      <p style="margin: 0; font-size: 12px; font-weight: 600; color: #6E6875">A hill I'll die on</p>
      <p style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 17px; line-height: 1.3">Matinees are better than evening shows.</p>
    </div>

    <a href="#" style="margin: 6px 18px 8px; min-height: 40px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">See Sam's full profile</a>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="padding: 0 24px 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 10px">
      <button class="secondary" style="flex: 1">Not this time</button>
      <button class="primary" style="flex: 1.3; height: 50px">I'd go</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="#" style="min-height: 40px; display: flex; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none">I can't do this time</a>
      <span style="font-size: 13px; color: #5F5966">Picks close tonight, 9pm</span>
    </div>
  </div>
  <nav aria-label="Main" style="display: flex; border-top: 1px solid #EAE3DB; background: #FFFFFF; padding: 6px 8px 24px">
    <button class="navbtn on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>This week</button>
    <button class="navbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Dates</button>
    <button class="navbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chats</button>
    <button class="navbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>You</button>
  </nav>
</div>
</x-dc>
