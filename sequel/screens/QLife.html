<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Life and future</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2A4B}a:hover{color:#6A1F39}
.q{margin:0;font:600 15px/1.3 Inter,sans-serif;color:#1C1A1F}
.opt{display:flex;align-items:center;justify-content:center;text-align:center;font:500 14px/1.25 Inter,sans-serif;color:#1C1A1F;background:#fff;border:1.5px solid #E4DCD3;border-radius:14px;padding:8px 8px;min-height:46px;cursor:pointer;flex:1}
.opt.on{background:#F6E6EC;border-color:#8A2A4B;color:#5E1A33;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.seg{display:flex;gap:8px;margin-top:10px}
.priv{font:500 12px Inter,sans-serif;color:#5F5966;display:inline-flex;align-items:center;gap:4px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, sans-serif; color: #1C1A1F; display: flex; flex-direction: column; padding: 48px 24px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span style="font-size: 13px; color: #5F5966; font-weight: 500">3 of 8 · Life and future</span>
    <span style="width: 44px"></span>
  </div>
  <div style="height: 4px; background: #ECE5DD; border-radius: 4px; margin-top: 8px; overflow: hidden"><div style="width: 37.5%; height: 4px; background: #8A2A4B"></div></div>

  <h1 style="margin: 22px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.12; letter-spacing: -0.01em">Where is life heading?</h1>

  <p class="q" style="margin-top: 18px">Kids</p>
  <div class="grid">
    <button class="opt" aria-pressed="false">Have them</button>
    <button class="opt on" aria-pressed="true">Want them</button>
    <button class="opt" aria-pressed="false">Don’t want them</button>
    <button class="opt" aria-pressed="false">Open to it</button>
  </div>

  <p class="q" style="margin-top: 20px">Would you date someone who has kids?</p>
  <div class="seg">
    <button class="opt on" aria-pressed="true">Yes</button>
    <button class="opt" aria-pressed="false">Maybe</button>
    <button class="opt" aria-pressed="false">No</button>
  </div>

  <p class="q" style="margin-top: 20px">In five years, you see yourself living…</p>
  <div class="seg">
    <button class="opt on" aria-pressed="true">Right here</button>
    <button class="opt" aria-pressed="false">Elsewhere</button>
    <button class="opt" aria-pressed="false">Not sure</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px">
    <p class="q">Your last relationship ended</p>
    <span class="priv"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private</span>
  </div>
  <div class="grid">
    <button class="opt" aria-pressed="false">Under 6 months ago</button>
    <button class="opt on" aria-pressed="true">6 months to 2 years</button>
    <button class="opt" aria-pressed="false">Longer ago</button>
    <button class="opt" aria-pressed="false">Haven’t had one</button>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 54px; border: none; border-radius: 27px; background: #1C1A1F; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Continue</button>
</div>

</html>
