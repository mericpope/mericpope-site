<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faith and politics</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2A4B}a:hover{color:#6A1F39}
.q{margin:0;font:600 15px/1.3 Inter,sans-serif;color:#1C1A1F}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;text-align:left;width:100%;font:500 15px/1.3 Inter,sans-serif;color:#1C1A1F;background:#fff;border:1.5px solid #E4DCD3;border-radius:14px;padding:10px 14px;min-height:46px;cursor:pointer}
.opt.on{background:#F6E6EC;border-color:#8A2A4B;color:#5E1A33;font-weight:600}
.seg{display:flex;gap:8px;margin-top:10px}
.seg .opt{flex:1;justify-content:center;text-align:center;font-size:14px;padding:8px 6px}
.priv{font:500 12px Inter,sans-serif;color:#5F5966;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, sans-serif; color: #1C1A1F; display: flex; flex-direction: column; padding: 48px 24px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span style="font-size: 13px; color: #5F5966; font-weight: 500">3 of 8 · Life and future</span>
    <span style="width: 44px"></span>
  </div>
  <div style="height: 4px; background: #ECE5DD; border-radius: 4px; margin-top: 8px; overflow: hidden; flex-shrink: 0"><div style="width: 37.5%; height: 4px; background: #8A2A4B"></div></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 22px">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em">Faith and politics</h2>
    <span style="font: 600 12px Inter, sans-serif; color: #3D3842; background: #F1ECE6; border-radius: 999px; padding: 4px 10px">Optional</span>
  </div>
  <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #5F5966">Your faith and politics show on your profile. Choose “Prefer not to say” to keep them off. How much they matter to you stays private.</p>

  <p class="q" style="margin-top: 20px">Faith</p>
  <div class="list">
    <button class="opt" aria-pressed="false">Important to me</button>
    <button class="opt on" aria-pressed="true">Part of my life</button>
    <button class="opt" aria-pressed="false">Not part of my life</button>
    <button class="opt" aria-pressed="false">Prefer not to say</button>
  </div>

  <label for="fname" style="margin-top: 16px; font: 600 15px Inter, sans-serif">Your faith, if you’d like to name it <span style="font-weight: 400; color: #5F5966">Optional</span></label>
  <input id="fname" value="Jewish" style="margin-top: 8px; font: 15px Inter, sans-serif; padding: 13px 14px; border: 1.5px solid #E4DCD3; border-radius: 14px; background: #fff; color: #1C1A1F; outline: none">

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; gap: 8px">
    <p class="q">Should a partner share your faith?</p>
    <span class="priv"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private</span>
  </div>
  <div class="seg">
    <button class="opt" aria-pressed="false">It matters a lot</button>
    <button class="opt" aria-pressed="false">I’d prefer it</button>
    <button class="opt on" aria-pressed="true">Doesn’t matter</button>
  </div>

  <p class="q" style="margin-top: 20px">Politics</p>
  <div class="list">
    <button class="opt on" aria-pressed="true">Left</button>
    <button class="opt" aria-pressed="false">Centre</button>
    <button class="opt" aria-pressed="false">Right</button>
    <button class="opt" aria-pressed="false">Not very political</button>
    <button class="opt" aria-pressed="false">Prefer not to say</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; gap: 8px">
    <p class="q">Sharing your politics matters…</p>
    <span class="priv"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private</span>
  </div>
  <div class="seg">
    <button class="opt" aria-pressed="false">A lot</button>
    <button class="opt on" aria-pressed="true">A bit</button>
    <button class="opt" aria-pressed="false">Not at all</button>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="flex-shrink: 0; height: 54px; border: none; border-radius: 27px; background: #1C1A1F; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Continue</button>
</div>
