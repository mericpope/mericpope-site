name: Stage Door catalogue

# Every Monday morning: pull new and closing shows from Official London Theatre and Wikipedia,
# update stagedoor/catalogue.json, and publish it. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: stagedoor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh the show list
        run: node .github/stagedoor/refresh.mjs stagedoor/catalogue.json .github/stagedoor/state.json
      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- stagedoor/catalogue.json; then echo "No new shows this week"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stagedoor/catalogue.json .github/stagedoor/state.json
          git commit -m "Stage Door: weekly show list refresh"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild from the push"
